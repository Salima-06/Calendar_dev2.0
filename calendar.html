<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<title>Calendar | Ducks In A Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Actor&family=Crimson+Text:wght@400;600&family=DM+Sans:wght@400;500;700&family=Delicious+Handrawn&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="app.css">
<!-- FullCalendar 7 with the "breezy" theme and the amber palette -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/skeleton.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/breezy/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/breezy/palettes/amber.css">
<style>
  :root{--urgent:#DD2E44;--soon:#FDCB58;--chill:#78B159;--class-blue:#4486BF}
  [hidden] { display: none !important; }   
  .dash-head .page-title{font-size:clamp(52px,9vw,120px);line-height:.9}

  .cal-wrap{padding-bottom:20px}
  .cal-actions{display:flex;flex-wrap:wrap;gap:12px;margin:clamp(18px,3vw,32px) 0 14px}
  .act{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px 0 14px;border:2px solid var(--gold);border-radius:999px;background:transparent;color:var(--cream);cursor:pointer;
    font:700 15px/1 "DM Sans",Arial,sans-serif;transition:background-color .2s ease,color .2s ease,transform .15s ease}
  .act .plus{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--bg);font:700 22px/1 "DM Sans",Arial,sans-serif;padding-bottom:2px;transition:transform .2s ease,background-color .2s ease,color .2s ease}
  .act:hover{background:var(--gold);color:var(--bg);transform:translateY(-2px)}
  .act:hover .plus{background:var(--bg);color:var(--gold);transform:rotate(90deg)}
  .act:active{transform:scale(.97)}
  .act:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .lg{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 16px 0 12px;border:2px solid var(--line);border-radius:999px;background:transparent;color:var(--cream);cursor:pointer;
    font:500 14px/1.1 "DM Sans",Arial,sans-serif;transition:background-color .15s ease,border-color .15s ease,opacity .15s ease,transform .15s ease}
  .lg .dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  .lg:hover{border-color:rgba(254,245,219,.5);transform:translateY(-1px)}
  .lg[aria-pressed=false]{opacity:.45}
  .lg[aria-pressed=false] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
  .lg:focus-visible{outline:3px solid var(--cream);outline-offset:2px}

  .courses{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .courses:empty{display:none}
  .cchip{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 14px;border-radius:999px;background:var(--class-blue);color:#fff;font:500 14px/1.2 "DM Sans",Arial,sans-serif}
  .cchip small{opacity:.8;font-size:12px}
  .cchip button{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:15px;line-height:1;cursor:pointer;transition:background-color .15s ease,color .15s ease}
  .cchip button:hover{background:#FF8A80;color:var(--bg)}
  .cchip button:focus-visible{outline:3px solid #fff;outline-offset:1px}

  .note{margin:0 0 14px;padding:12px 16px;border-radius:14px;background:rgba(120,177,89,.16);border:1px solid var(--chill);color:#D7EFC9;font-size:15px}
  .note[hidden]{display:none}

  /* the calendar sits on the page background; the theme's dark scheme does the rest */
  .cal-panel{padding:clamp(8px,1.6vw,18px);border:1px solid var(--line);border-radius:var(--radius);
    --fc-breezy-background:var(--bg);--fc-breezy-popover:var(--bg-soft);--fc-breezy-foreground:var(--cream);--fc-breezy-strong-foreground:var(--cream);color:var(--cream)}
  .cal-panel .fc{font-family:"DM Sans",Arial,sans-serif}
  /* Events are drawn as solid blocks in their urgency colour (the theme normally tints them) */
  .cal-panel [style*="--fc-event-color"]{background-color:var(--fc-event-color)!important;color:var(--fc-event-contrast-color)!important;border-color:var(--fc-event-color)!important;border-radius:8px}
  .cal-panel [style*="--fc-event-color"] *{color:inherit!important}
  .cal-panel [style*="--fc-event-color"]:hover{filter:brightness(1.1)}


  /* urgency chooser in the dialog */
  .urg{margin:0;padding:0;border:0;display:grid;gap:8px}
  .urg legend{padding:0;margin-bottom:6px;font:700 13px/1.2 "DM Sans",Arial,sans-serif}
  .urg-opt{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;font:500 15px/1.2 "DM Sans",Arial,sans-serif;
    transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
  .urg-opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .urg-opt .dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--c)}
  .urg-opt:hover{border-color:rgba(254,245,219,.45);transform:translateY(-1px)}
  .urg-opt:has(input:checked){border-color:var(--c);background:rgba(254,245,219,.07)}
  .urg-opt:has(input:focus-visible){outline:3px solid var(--cream);outline-offset:2px}
  textarea{width:100%;min-height:84px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--cream);font:400 16px/1.4 "DM Sans",Arial,sans-serif;resize:vertical;transition:border-color .2s ease,box-shadow .2s ease}
  textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(223,178,48,.25)}
  select{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--cream);font:400 16px "DM Sans",Arial,sans-serif;color-scheme:dark}
  select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(223,178,48,.25)}
  .hint{margin:0;font-size:13px;color:var(--muted)}
  .dlg-actions .grow{flex:1}
  .btn-danger{background:transparent;color:#FF8A80;border-color:#FF8A80}
  .btn-danger:hover{background:#FF8A80;color:var(--bg)}
  .facts{display:grid;gap:6px;margin:0;font-size:15px}
  .facts div{display:flex;gap:10px}
  .facts dt{flex:none;width:92px;color:var(--muted)}
  .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .lg-note{margin:0;color:var(--muted);font-size:13px}
  dialog{max-height:calc(100dvh - 32px);overflow:auto}
  .row2.three{grid-template-columns:1fr 1fr}

  @media (max-width:640px){
    .act{flex:1 1 100%;justify-content:flex-start}
    .lg{font-size:13px}
  }
</style>
</head>
<body>
<header class="wrap dash-head">
  <a class="brand" href="index.html" aria-label="Ducks In A Row, home"><img src="assets/logo.png" alt="Ducks In A Row logo" width="90" height="90"></a>
  <h1 class="page-title">Calendar</h1>

  <div class="account" id="account">
    <button class="acct-btn" id="acct-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu" aria-label="Account menu">
      <svg viewBox="0 0 25 31" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12.5" cy="9" r="5.5"/><path d="M2 29c0-6 4.7-10 10.5-10S23 23 23 29"/></svg>
    </button>
    <div class="acct-menu" id="acct-menu" role="menu" aria-label="Account" hidden>
      <a role="menuitem" href="dashboard.html">Dashboard</a>
      <a role="menuitem" href="calendar.html" aria-current="page">Calendar</a>
      <a role="menuitem" href="tasks.html">Task Manager</a>
      <a role="menuitem" href="grades.html">Grade book</a>
      <a role="menuitem" href="account.html">Account</a>
      <div class="sep" role="separator"></div>
      <button role="menuitem" class="item" id="signout" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap cal-wrap">
  <div class="gate" id="gate">Loading your calendar…</div>

  <div id="content" hidden>
    <p class="toast" id="toast" role="alert" hidden></p>
    <p class="note" id="note" role="status" hidden></p>

    <div class="cal-actions">
      <button class="act" type="button" id="add-event"><span class="plus" aria-hidden="true">+</span>Add event</button>
      <button class="act" type="button" id="add-course"><span class="plus" aria-hidden="true">+</span>Add Carleton course</button>
      <button class="act" type="button" id="add-ics"><span class="plus" aria-hidden="true">+</span>Add Brightspace link</button>
    </div>

    <div class="legend" id="legend" role="group" aria-label="Show or hide on the calendar"></div>
    <div class="courses" id="courses" aria-label="Your Carleton courses"></div>

    <div class="cal-panel" data-color-scheme="dark"><div id="calendar"></div></div>
  </div>
</main>

<footer>
  <div class="wrap footer-row">
    <img src="assets/logo.png" alt="" width="38" height="38">
    <p><span>© Ducks In A Row.</span><span>2026</span><span>All Rights Reserved</span></p>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="dlg-form" novalidate>
    <h2 id="dlg-title">Add</h2>
    <div class="fields" id="dlg-fields"></div>
    <p class="form-err" id="dlg-err" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-danger" id="dlg-del" hidden>Delete</button>
      <button type="button" class="btn btn-danger" id="dlg-del2" hidden>Delete all</button>
      <span class="grow"></span>
      <button type="button" class="btn btn-outline" id="dlg-cancel">Cancel</button>
      <button type="submit" class="btn" id="dlg-save">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/all/global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/breezy/global.js"></script>
<script src="clerk-config.js"></script>
<script src="auth.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="calendar.js"></script>
</body>
</html>
